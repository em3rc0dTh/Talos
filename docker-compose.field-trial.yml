services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "17233:7233"
      - "18233:8233"
    restart: unless-stopped

  talos:
    build:
      context: .
      dockerfile: Dockerfile.field-trial
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      TALOS_RUNTIME_DIR: /data/talos-runtime
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
    ports:
      - "8787:8787"
    depends_on:
      - temporal
    volumes:
      - talos_field_trial_runtime:/data/talos-runtime
      - ./evidence/field-trials:/workspace/evidence/field-trials
    restart: unless-stopped

volumes:
  talos_field_trial_runtime:
