name: One-shot Talos merged-branch cleanup

# Runs only when this cleanup workflow file itself changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-merged-branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove merged and fully contained branches with backups
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          backup_prefix="archive/branch-cleanup-2026-10-19"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          
          gh api --paginate "repos/$repo/pulls?state=all&per_page=100" --jq '.[] | select(.merged_at != null) | .head.ref' > "$tmp/merged"
          gh api --paginate "repos/$repo/pulls?state=all&per_page=100" --jq '.[] | select(.state == "open") | .head.ref' > "$tmp/open"
          gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv' > "$tmp/branches"
          
          removed=0
          skipped=0
          archived=0
          while IFS=$'\t' read -r branch snapshot_sha; do
            [[ -n "$branch" && "$branch" != "main" ]] || continue
            if grep -Fxq "$branch" "$tmp/open"; then
              echo "KEEP open PR: $branch"
              skipped=$((skipped+1))
              continue
            fi
            current_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$current_sha" || "$current_sha" != "$snapshot_sha" ]]; then
              echo "KEEP moving or missing ref: $branch"
              skipped=$((skipped+1))
              continue
            fi
            ahead="$(gh api "repos/$repo/compare/main...$branch" --jq '.ahead_by' 2>/dev/null || true)"
            if [[ ! "$ahead" =~ ^[0-9]+$ ]]; then
              echo "KEEP cannot compare: $branch"
              skipped=$((skipped+1))
              continue
            fi
            if [[ "$ahead" != "0" ]] && ! grep -Fxq "$branch" "$tmp/merged"; then
              echo "KEEP unique, unmerged commits ($ahead): $branch"
              skipped=$((skipped+1))
              continue
            fi
            # GitHub may squash/rebase a merged PR. Preserve its unique tip via a recoverable tag.
            if [[ "$ahead" != "0" ]]; then
              tag="$backup_prefix/$branch"
              gh api -X POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$snapshot_sha" > /dev/null
              echo "ARCHIVED as tag $tag"
              archived=$((archived+1))
            fi
            # Recheck for activity before deleting the ref.
            latest_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$latest_sha" != "$snapshot_sha" ]]; then
              echo "KEEP changed during cleanup: $branch"
              skipped=$((skipped+1))
              continue
            fi
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" > /dev/null
            echo "REMOVED: $branch"
            removed=$((removed+1))
          done < "$tmp/branches"
          # Historical local-release aliases share an identical tip. Keep one exact
          # surviving ref and remove only byte-for-byte duplicate heads.
          canonical_release="release/talos-1.0-local-test"
          canonical_sha="$(gh api "repos/$repo/git/ref/heads/$canonical_release" --jq '.object.sha')"
          duplicates=0
          while IFS=
            echo "- Removed branches: $removed"
            echo "- Removed exact duplicate local-release aliases: $duplicates"
            echo "- Archived divergent merged tips (tags): $archived"
            echo "- Skipped branches: $skipped"
            echo "- Unmerged divergent branches preserved for integration review"
          } >> "$GITHUB_STEP_SUMMARY"
\t' read -r branch snapshot_sha; do
            [[ "$branch" == release/talos* ]] || continue
            [[ "$branch" != "$canonical_release" ]] || continue
            [[ "$snapshot_sha" == "$canonical_sha" ]] || continue
            grep -Fxq "$branch" "$tmp/open" && continue
            latest_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            [[ "$latest_sha" == "$snapshot_sha" ]] || continue
            gh api -X DELETE "repos/$repo/git/refs/heads/$branch" > /dev/null
            echo "REMOVED duplicate local release alias: $branch"
            duplicates=$((duplicates+1))
          done < "$tmp/branches"
          {
            echo "### Talos one-shot merged-branch cleanup"
            echo "- Removed branches: $removed"
            echo "- Archived divergent merged tips (tags): $archived"
            echo "- Skipped branches: $skipped"
            echo "- Unmerged divergent branches preserved for integration review"
          } >> "$GITHUB_STEP_SUMMARY"
