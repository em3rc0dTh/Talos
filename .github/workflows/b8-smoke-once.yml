name: B8 reference app one-shot gate
on:
  push:
    paths:
      - '.github/workflows/b8-smoke-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json
      - name: Verify immutable lock + reference Temporal app
        working-directory: build/reference-vertical-slice
        run: |
          npm ci
          npm run b7:lock:verify
          TALOS_SKIP_CONTRACT_HASH=1 npm run architecture:verify
          npm run b8:test
