name: B7 Temporal SDK lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b7-temporal-lock.yml'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/package-lock.json'
      - 'build/reference-vertical-slice/apps/*/package.json'
      - 'build/reference-vertical-slice/packages/*/package.json'
      - 'build/reference-vertical-slice/workers/*/package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/b7-temporal-lock.yml'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/package-lock.json'
      - 'build/reference-vertical-slice/apps/*/package.json'
      - 'build/reference-vertical-slice/packages/*/package.json'
      - 'build/reference-vertical-slice/workers/*/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-lock:
    name: Verify checked-in Temporal SDK lock (never regenerate in CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json
      - name: Install exact committed lock
        working-directory: build/reference-vertical-slice
        run: npm ci
      - name: Verify pinned Temporal SDK and workspace metadata
        working-directory: build/reference-vertical-slice
        run: npm run b7:lock:verify
      - name: Require immutable dependency metadata
        run: git diff --exit-code -- build/reference-vertical-slice/package.json build/reference-vertical-slice/package-lock.json
