name: B7 Temporal SDK lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/b7-temporal-lock.yml'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/apps/*/package.json'
      - 'build/reference-vertical-slice/packages/*/package.json'
      - 'build/reference-vertical-slice/workers/*/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
          cache-dependency-path: build/reference-vertical-slice/package-lock.json

      - name: Generate exact Temporal 1.22.0 lock and workspace metadata
        working-directory: build/reference-vertical-slice
        run: |
          npm install --package-lock-only --save-exact --ignore-scripts \
            @temporalio/common@1.22.0 \
            @temporalio/client@1.22.0 \
            @temporalio/worker@1.22.0 \
            @temporalio/workflow@1.22.0 \
            @temporalio/activity@1.22.0
          npm install --package-lock-only --save-dev --save-exact --ignore-scripts \
            @temporalio/testing@1.22.0

      - name: Verify B7 Temporal lock gate
        working-directory: build/reference-vertical-slice
        run: node ./scripts/verify-b7-temporal-lock.mjs --require-ready

      - name: Upload generated lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: b7-temporal-lock
          path: |
            build/reference-vertical-slice/package.json
            build/reference-vertical-slice/package-lock.json
          if-no-files-found: error

      - name: Commit generated lock
        run: |
          if git diff --quiet -- build/reference-vertical-slice/package.json build/reference-vertical-slice/package-lock.json; then
            echo 'Temporal/workspace lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/reference-vertical-slice/package.json build/reference-vertical-slice/package-lock.json
          git commit -m 'build: synchronize reference workspace lock'
          git push
