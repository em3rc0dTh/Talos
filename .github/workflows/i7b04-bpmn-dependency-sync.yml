name: I7B-04 BPMN dependency sync

on:
  push:
    branches: [image-i7b04-bpmn-roundtrip-v0.1]
    paths:
      - '.github/workflows/i7b04-bpmn-dependency-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-bpmn-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: image-i7b04-bpmn-roundtrip-v0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json

      - name: Add exact BPMN model dependency
        working-directory: build/reference-vertical-slice
        run: npm install --save-exact --ignore-scripts bpmn-moddle@10.1.0

      - name: Verify generated lock is installable
        working-directory: build/reference-vertical-slice
        run: npm ci --ignore-scripts

      - name: Commit generated package metadata
        run: |
          if git diff --quiet -- build/reference-vertical-slice/package.json build/reference-vertical-slice/package-lock.json; then
            echo 'Dependency metadata already synchronized.'
            exit 0
          fi
          git config user.name 'talos-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -- build/reference-vertical-slice/package.json build/reference-vertical-slice/package-lock.json
          git commit -m 'chore(i7b04): lock bpmn-moddle 10.1.0'
          git push origin HEAD:image-i7b04-bpmn-roundtrip-v0.1
