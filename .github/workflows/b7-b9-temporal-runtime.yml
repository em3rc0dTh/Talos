name: B7-B9 Temporal reference runtime

on:
  push:
    paths:
      - '.github/workflows/b7-b9-temporal-runtime.yml'
      - 'build/reference-vertical-slice/workers/reference-temporal-worker/**'
      - 'build/reference-vertical-slice/tests/b7-temporal-sdk.test.ts'
      - 'build/reference-vertical-slice/tests/b9-temporal-e2e.test.ts'
      - 'build/reference-vertical-slice/tests/helpers/reference-runtime-program.ts'
      - 'build/reference-vertical-slice/packages/reference-email-sink/**'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
          cache-dependency-path: build/reference-vertical-slice/package-lock.json

      - name: Install exact locked dependencies
        id: install
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: npm ci 2>&1 | tee /tmp/talos-install.log

      - name: Verify Temporal lock gate
        id: lock
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: npm run b7:lock:verify 2>&1 | tee /tmp/talos-lock.log

      - name: Verify architecture boundaries
        id: arch
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          TALOS_SKIP_CONTRACT_HASH=1 npm run architecture:verify 2>&1 | tee /tmp/talos-arch.log

      - name: Verify real SDK Activity boundary
        id: sdk
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          node --experimental-strip-types --test ./tests/b7-temporal-sdk.test.ts 2>&1 | tee /tmp/talos-sdk.log

      - name: Run real local Temporal E2E
        id: e2e
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          node --experimental-strip-types --test ./tests/b9-temporal-e2e.test.ts 2>&1 | tee /tmp/talos-e2e.log

      - name: Write CI evidence
        env:
          INSTALL: ${{ steps.install.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          ARCH: ${{ steps.arch.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          if [ "$INSTALL" = success ] && [ "$LOCK" = success ] && [ "$ARCH" = success ] && [ "$SDK" = success ] && [ "$E2E" = success ]; then
            OVERALL=PASS
          else
            OVERALL=FAIL
          fi
          {
            echo '# B7/B9 Temporal Runtime CI Result'
            echo
            echo "Status: **$OVERALL**"
            echo
            echo 'Generated by the network-capable GitHub Actions reference-runtime gate.'
            echo
            echo '```text'
            printf '%-26s %s\n' 'npm ci' "$INSTALL"
            printf '%-26s %s\n' 'Temporal lock gate' "$LOCK"
            printf '%-26s %s\n' 'architecture guard' "$ARCH"
            printf '%-26s %s\n' 'real SDK Activity tests' "$SDK"
            printf '%-26s %s\n' 'local Temporal E2E' "$E2E"
            echo '```'
            echo
            echo 'The E2E stage uses `@temporalio/testing` `TestWorkflowEnvironment.createLocal()`, a real Temporal Worker, Workflow Update, Activity execution/retry, provider effect store, and server-backed Workflow history.'
            if [ "$ARCH" != success ]; then
              echo
              echo '## Architecture failure tail'
              echo '```text'
              tail -n 80 /tmp/talos-arch.log || true
              echo '```'
            fi
            if [ "$SDK" != success ]; then
              echo
              echo '## SDK test failure tail'
              echo '```text'
              tail -n 80 /tmp/talos-sdk.log || true
              echo '```'
            fi
            if [ "$E2E" != success ]; then
              echo
              echo '## E2E failure tail'
              echo '```text'
              tail -n 120 /tmp/talos-e2e.log || true
              echo '```'
            fi
          } > test/103-B7-B9-TEMPORAL-RUNTIME-CI-RESULT.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/103-B7-B9-TEMPORAL-RUNTIME-CI-RESULT.md
          if ! git diff --cached --quiet; then
            git commit -m "test(b7-b9): record Temporal runtime CI $OVERALL"
            git push
          fi
          echo "OVERALL=$OVERALL" >> "$GITHUB_ENV"

      - name: Enforce runtime gate
        if: always()
        run: |
          if [ "$OVERALL" != PASS ]; then
            exit 1
          fi
