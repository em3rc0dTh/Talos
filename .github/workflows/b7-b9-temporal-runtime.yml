name: B7-B9 Temporal reference runtime

on:
  push:
    paths:
      - '.github/workflows/b7-b9-temporal-runtime.yml'
      - 'build/reference-vertical-slice/workers/reference-temporal-worker/**'
      - 'build/reference-vertical-slice/apps/reference-api/**'
      - 'build/reference-vertical-slice/packages/application/src/reference-vertical-slice.ts'
      - 'build/reference-vertical-slice/tests/b7-temporal-sdk.test.ts'
      - 'build/reference-vertical-slice/tests/b8-reference-app.test.ts'
      - 'build/reference-vertical-slice/tests/b9-temporal-e2e.test.ts'
      - 'build/reference-vertical-slice/tests/helpers/reference-runtime-program.ts'
      - 'build/reference-vertical-slice/packages/reference-email-sink/**'
      - 'build/reference-vertical-slice/architecture/module-boundaries.json'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'build/reference-vertical-slice/**'
      - '.github/workflows/b7-b9-temporal-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temporal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'
          cache-dependency-path: build/reference-vertical-slice/package-lock.json

      - name: Install exact locked dependencies
        id: install
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: npm ci 2>&1 | tee /tmp/talos-install.log

      - name: Verify Temporal lock gate
        id: lock
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: npm run b7:lock:verify 2>&1 | tee /tmp/talos-lock.log

      - name: Verify architecture boundaries
        id: arch
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          TALOS_SKIP_CONTRACT_HASH=1 npm run architecture:verify 2>&1 | tee /tmp/talos-arch.log

      - name: Verify real SDK Activity boundary
        id: sdk
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          npm run b7:sdk:test 2>&1 | tee /tmp/talos-sdk.log

      - name: Run tryable local Talos app smoke test
        id: b8
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          npm run b8:test 2>&1 | tee /tmp/talos-b8.log

      - name: Run real local Temporal E2E
        id: e2e
        continue-on-error: true
        working-directory: build/reference-vertical-slice
        run: |
          set -o pipefail
          npm run b9:test 2>&1 | tee /tmp/talos-e2e.log

      - name: Write CI evidence
        env:
          INSTALL: ${{ steps.install.outcome }}
          LOCK: ${{ steps.lock.outcome }}
          ARCH: ${{ steps.arch.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          B8: ${{ steps.b8.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          if [ "$INSTALL" = success ] && [ "$LOCK" = success ] && [ "$ARCH" = success ] && [ "$SDK" = success ] && [ "$E2E" = success ]; then RUNTIME=PASS; else RUNTIME=FAIL; fi
          if [ "$INSTALL" = success ] && [ "$LOCK" = success ] && [ "$ARCH" = success ] && [ "$B8" = success ]; then APP=PASS; else APP=FAIL; fi
          if [ "$RUNTIME" = PASS ] && [ "$APP" = PASS ]; then OVERALL=PASS; else OVERALL=FAIL; fi
          echo "OVERALL=$OVERALL" >> "$GITHUB_ENV"

          {
            echo '# B7/B9 Temporal Runtime CI Result'; echo; echo "Status: **$RUNTIME**"; echo
            echo '```text'
            printf '%-26s %s\n' 'npm ci' "$INSTALL"
            printf '%-26s %s\n' 'Temporal lock gate' "$LOCK"
            printf '%-26s %s\n' 'architecture guard' "$ARCH"
            printf '%-26s %s\n' 'real SDK Activity tests' "$SDK"
            printf '%-26s %s\n' 'local Temporal E2E' "$E2E"
            echo '```'
            if [ "$ARCH" != success ]; then echo; echo '## Architecture failure tail'; echo '```text'; tail -n 100 /tmp/talos-arch.log || true; echo '```'; fi
            if [ "$SDK" != success ]; then echo; echo '## SDK failure tail'; echo '```text'; tail -n 100 /tmp/talos-sdk.log || true; echo '```'; fi
            if [ "$E2E" != success ]; then echo; echo '## E2E failure tail'; echo '```text'; tail -n 180 /tmp/talos-e2e.log || true; echo '```'; fi
          } > test/103-B7-B9-TEMPORAL-RUNTIME-CI-RESULT.md

          {
            echo '# B8 Tryable Reference App CI Result'; echo; echo "Status: **$APP**"; echo
            echo '```text'
            printf '%-26s %s\n' 'npm ci' "$INSTALL"
            printf '%-26s %s\n' 'Temporal lock gate' "$LOCK"
            printf '%-26s %s\n' 'architecture guard' "$ARCH"
            printf '%-26s %s\n' 'B8 app smoke test' "$B8"
            echo '```'
            echo
            echo 'The smoke test boots the real Talos reference pipeline, local Temporal server/Worker and HTTP app, then executes APPROVED and REJECTED requests through Workflow Updates.'
            if [ "$ARCH" != success ]; then echo; echo '## Architecture failure tail'; echo '```text'; tail -n 100 /tmp/talos-arch.log || true; echo '```'; fi
            if [ "$B8" != success ]; then echo; echo '## B8 failure tail'; echo '```text'; tail -n 220 /tmp/talos-b8.log || true; echo '```'; fi
          } > test/104-B8-TRYABLE-REFERENCE-APP-CI-RESULT-v0.1.md

          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add test/103-B7-B9-TEMPORAL-RUNTIME-CI-RESULT.md test/104-B8-TRYABLE-REFERENCE-APP-CI-RESULT-v0.1.md
            if ! git diff --cached --quiet; then
              git commit -m "test: record runtime/app CI $RUNTIME/$APP"
              git pull --rebase || true
              git push || true
            fi
          fi

      - name: Enforce runtime/app gate
        if: always()
        run: test "$OVERALL" = PASS
