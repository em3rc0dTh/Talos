name: One-shot Security Lock Repair
on:
  push:
    branches: [fix/r1-release-hardening-2026-10-19]
    paths:
      - '.github/workflows/repair-lock-audit-2026-10.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r1-release-hardening-2026-10-19
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json
      - name: Repair compatible vulnerable transitive package resolutions
        working-directory: build/reference-vertical-slice
        shell: bash
        run: |
          set -euo pipefail
          cp package.json /tmp/talos-manifest-before.json
          npm audit fix --package-lock-only --ignore-scripts
          cmp package.json /tmp/talos-manifest-before.json
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run b7:lock:verify
          TALOS_SKIP_CONTRACT_HASH=1 npm run architecture:verify
      - name: Commit only repaired package-lock to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/reference-vertical-slice/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already clean.'
            exit 0
          fi
          git commit -m 'fix(security): resolve vulnerable npm transitive packages in exact lock'
          git push origin HEAD:fix/r1-release-hardening-2026-10-19
