name: I7C-06 wait correction sync

on:
  push:
    branches: [image-i7c06-adversarial-certification-v0.1]
    paths:
      - '.github/workflows/i7c06-wait-correction-sync.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-i7c06-adversarial-certification-v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json
      - name: Apply exact reviewer-contract migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('build/reference-vertical-slice/packages/application/src/semantic-correction.ts')
          s = p.read_text()
          old = """    if (command.targetPropertyPath === 'details.subprocessMode') {\n      return entry.kind === 'CHANGED' && entry.propertyPath === 'node' && target.has(entry.subjectRef);\n    }\n    if (command.targetPropertyPath === 'conditionRuleRef') {"""
          new = """    if (command.targetPropertyPath === 'details.subprocessMode' || command.targetPropertyPath === 'details.waitSemantics') {\n      return entry.kind === 'CHANGED' && entry.propertyPath === 'node' && target.has(entry.subjectRef);\n    }\n    if (command.targetPropertyPath === 'conditionRuleRef') {"""
          if old not in s: raise SystemExit('semantic-correction expectedDifference anchor missing')
          s = s.replace(old, new, 1)

          anchor = """  if (command.actionKind === 'CORRECT_PROPERTY' && command.targetPropertyPath === 'conditionRuleRef') {"""
          block = """  if (command.actionKind === 'CORRECT_PROPERTY' && command.targetPropertyPath === 'details.waitSemantics') {\n    if (command.targetSubjectRefs.length !== 1 || !command.proposedValue || typeof command.proposedValue !== 'object' || Array.isArray(command.proposedValue)) return undefined;\n    const node = nodes.find((item) => item.id === command.targetSubjectRefs[0]);\n    if (!node || node.kind !== 'WAIT') return undefined;\n    const proposal = command.proposedValue as Record<string, unknown>;\n    const waitKind = typeof proposal.waitKind === 'string' ? proposal.waitKind.trim() : '';\n    const supported = new Set(['SCHEDULE','DEADLINE','EXTERNAL_EVENT','MESSAGE','HUMAN_RESPONSE','CONDITION']);\n    if (!supported.has(waitKind)) return undefined;\n    const nextDetails: Record<string, unknown> = { ...(node.details ?? {}), waitKind };\n    const authored: [string, unknown][] = [['details.waitKind', waitKind]];\n    if (waitKind === 'SCHEDULE' || waitKind === 'DEADLINE') {\n      const expression = proposal.expression;\n      const timezone = typeof proposal.timezone === 'string' ? proposal.timezone.trim() : '';\n      if ((typeof expression !== 'string' && (typeof expression !== 'object' || expression === null || Array.isArray(expression))) || !timezone) return undefined;\n      nextDetails.expression = expression;\n      nextDetails.timezone = timezone;\n      authored.push(['details.expression', expression], ['details.timezone', timezone]);\n    } else {\n      const resumeSemantics = typeof proposal.resumeSemantics === 'string' ? proposal.resumeSemantics.trim() : '';\n      if (!resumeSemantics) return undefined;\n      nextDetails.resumeSemantics = resumeSemantics;\n      authored.push(['details.resumeSemantics', resumeSemantics]);\n    }\n    node.details = nextDetails;\n    node.truthClass = 'CONFIRMED';\n    for (const [propertyPath, value] of authored) {\n      authoredClaims.push(correctionClaim(command, node.id, propertyPath, value, at, previousClaims(node.id, propertyPath)));\n      confirmationDrafts.push({ subjectRef: node.id, propertyPath, value });\n    }\n    return { nodes, edges, rules, authoredClaims, confirmationDrafts, supportingRefs };\n  }\n\n"""
          if anchor not in s: raise SystemExit('semantic-correction mutation anchor missing')
          s = s.replace(anchor, block + anchor, 1)
          p.write_text(s)

          p = Path('build/reference-vertical-slice/packages/semantic-core/src/validation.ts')
          s = p.read_text()
          old = """      const timezone=props.timezone??props['propertyValues.timezone'];\n      const expression=props.expression??props['propertyValues.expression'];"""
          new = """      const timezone=node.details?.timezone??props.timezone??props['propertyValues.timezone'];\n      const expression=node.details?.expression??props.expression??props['propertyValues.expression'];"""
          if old not in s: raise SystemExit('validation timing anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('build/reference-vertical-slice/tests/image-i5a-02-semantic-correction.test.ts')
          s = p.read_text()
          old = """    rationale: 'Business reviewer authors the structured YES-branch business rule.',\n  }));\n\n  return current;\n}"""
          new = """    rationale: 'Business reviewer authors the structured YES-branch business rule.',\n  }));\n\n  const waitAfterRules = byName(current.process, 'On Next Wednesday');\n  current = apply(repo, current, command(current, 5, {\n    actionKind: 'CORRECT_PROPERTY',\n    targetSubjectRefs: [waitAfterRules.id],\n    targetPropertyPath: 'details.waitSemantics',\n    proposedValue: { waitKind: 'SCHEDULE', expression: 'NEXT_WEDNESDAY', timezone: 'America/Lima' },\n    rationale: 'Business reviewer explicitly defines the schedule semantics and timezone; the image label alone was insufficient.',\n  }));\n\n  return current;\n}"""
          if old not in s: raise SystemExit('semantic-correction test fullCorrection anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('build/reference-vertical-slice/tests/image-i5a-02-freeze-preflight.test.ts')
          s = p.read_text()
          old = """    proposedValue: { naturalLanguage: 'Customer exists', expression: { fact: 'customerExists', operator: 'EQUALS', value: true } },\n  }));\n  return current;\n}"""
          new = """    proposedValue: { naturalLanguage: 'Customer exists', expression: { fact: 'customerExists', operator: 'EQUALS', value: true } },\n  }));\n\n  const waitAfterRules = byName(current.process, 'On Next Wednesday');\n  current = apply(repo, current, correctionCommand(current, 5, {\n    actionKind: 'CORRECT_PROPERTY',\n    targetSubjectRefs: [waitAfterRules.id],\n    targetPropertyPath: 'details.waitSemantics',\n    proposedValue: { waitKind: 'SCHEDULE', expression: 'NEXT_WEDNESDAY', timezone: 'America/Lima' },\n    rationale: 'Business reviewer explicitly defines the schedule semantics and timezone.',\n  }));\n  return current;\n}"""
          if old not in s: raise SystemExit('freeze preflight correction anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("assert.equal(correctionCommands.length, 4);", "assert.equal(correctionCommands.length, 5);", 1)
          s = s.replace("assert.equal(correctionApplications.length, 4);", "assert.equal(correctionApplications.length, 5);", 1)
          s = s.replace("assert.equal(fromConfirmed.length, 5, 'confirmed baseline plus four semantic corrections must remain as five immutable revisions');", "assert.equal(fromConfirmed.length, 6, 'confirmed baseline plus five semantic corrections must remain as six immutable revisions');", 1)
          p.write_text(s)
          PY
      - name: Install exact lock
        working-directory: build/reference-vertical-slice
        run: npm ci
      - name: Verify migrated historical correction gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5a02:test
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/reference-vertical-slice/packages/application/src/semantic-correction.ts build/reference-vertical-slice/packages/semantic-core/src/validation.ts build/reference-vertical-slice/tests/image-i5a-02-semantic-correction.test.ts build/reference-vertical-slice/tests/image-i5a-02-freeze-preflight.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(i7c06): require explicit reviewer-authored wait semantics'
          git push origin HEAD:image-i7c06-adversarial-certification-v0.1
