name: Image vertical slice

on:
  push:
    branches: ['image-*']
    paths:
      - '.github/workflows/image-vslice.yml'
      - 'build/reference-vertical-slice/packages/image-perception/**'
      - 'build/reference-vertical-slice/packages/application/**'
      - 'build/reference-vertical-slice/packages/review/**'
      - 'build/reference-vertical-slice/packages/capability/**'
      - 'build/reference-vertical-slice/packages/execution/**'
      - 'build/reference-vertical-slice/packages/temporal-design/**'
      - 'build/reference-vertical-slice/packages/runtime-policy/**'
      - 'build/reference-vertical-slice/packages/deployment/**'
      - 'build/reference-vertical-slice/workers/reference-temporal-worker/**'
      - 'build/reference-vertical-slice/tests/image-*.test.ts'
      - 'build/reference-vertical-slice/tests/r1-*.test.ts'
      - 'build/reference-vertical-slice/tests/b4-freeze-hardening.test.ts'
      - 'build/reference-vertical-slice/tests/helpers/**'
      - 'build/reference-vertical-slice/apps/reference-api/**'
      - 'build/reference-vertical-slice/architecture/module-boundaries.json'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'build/reference-vertical-slice/packages/image-perception/**'
      - 'build/reference-vertical-slice/packages/application/**'
      - 'build/reference-vertical-slice/packages/review/**'
      - 'build/reference-vertical-slice/packages/capability/**'
      - 'build/reference-vertical-slice/packages/execution/**'
      - 'build/reference-vertical-slice/packages/temporal-design/**'
      - 'build/reference-vertical-slice/packages/runtime-policy/**'
      - 'build/reference-vertical-slice/packages/deployment/**'
      - 'build/reference-vertical-slice/workers/reference-temporal-worker/**'
      - 'build/reference-vertical-slice/tests/image-*.test.ts'
      - 'build/reference-vertical-slice/tests/r1-*.test.ts'
      - 'build/reference-vertical-slice/tests/b4-freeze-hardening.test.ts'
      - 'build/reference-vertical-slice/tests/helpers/**'
      - 'build/reference-vertical-slice/apps/reference-api/**'
      - 'build/reference-vertical-slice/architecture/module-boundaries.json'
      - 'build/reference-vertical-slice/package.json'
      - 'build/reference-vertical-slice/package-lock.json'
      - '.github/workflows/image-vslice.yml'
  workflow_dispatch:

jobs:
  image-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json

      - name: Install exact lock
        working-directory: build/reference-vertical-slice
        run: npm ci

      - name: Verify architecture
        working-directory: build/reference-vertical-slice
        run: TALOS_SKIP_CONTRACT_HASH=1 npm run architecture:verify

      - name: Regress frozen B2 source-intake implementation
        working-directory: build/reference-vertical-slice
        run: npm run b2:test

      - name: Regress frozen B3 canonical/validation implementation
        working-directory: build/reference-vertical-slice
        run: npm run b3:test

      - name: Regress frozen B4 review implementation
        working-directory: build/reference-vertical-slice
        run: npm run b4:test

      - name: Run I0 exact image intake gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i0:test

      - name: Run I1 provider/perception gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i1:test

      - name: Run I2 common source-evidence gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i2:test

      - name: Run I3 browser image review gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i3:test

      - name: Run I4 canonical + validation gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i4:test

      - name: Run R1 product regression gates
        working-directory: build/reference-vertical-slice
        run: node --experimental-strip-types --test ./tests/r1-*.test.ts

      - name: Run I5A-01 source-agnostic confirmation gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5a01:test

      - name: Run I5A-02 semantic correction / addition gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5a02:test

      - name: Run I5B-00 freeze hardening / source-agnostic freeze gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5b00:test

      - name: Run I5C-01 generic capability design gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5c01:test

      - name: Run I5C-02 generic ExecutionPlan draft gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5c02:test

      - name: Run I5C-03 capability binding / human design / resolved ExecutionPlan gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i5c03:test

      - name: Run I6 generic image to real Temporal runtime gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i6:test

      - name: Run I7A arbitrary image admission gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7a:test

      - name: Run I7B-01 async provider transport / validation gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b01:test

      - name: Run I7B-02 BPMN business-process confirmation gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b02:test

      - name: Run I7B-03 canonical to BPMN projection gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b03:test

      - name: Run I7B-04 BPMN XML and DI round-trip gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b04:test

      - name: Run I7B-05 real Process Confirmation workspace gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b05:test

      - name: Run I7B-06 natural-language BPMN correction gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b06:test

      - name: Run I7B-07 confirmation to semantic freeze integration gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b07:test

      - name: Run I7B-08 full Process Confirmation browser/canonical gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7b08:test

      - name: Run I7C-01 credential-safe runtime configuration gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7c01:test

      - name: Run I7C-02 exact response-correlation gate
        working-directory: build/reference-vertical-slice
        run: npm run image:i7c02:test

      - name: Run current image edge gate
        working-directory: build/reference-vertical-slice
        run: npm run image:edge:test
