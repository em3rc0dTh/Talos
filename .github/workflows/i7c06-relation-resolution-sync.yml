name: I7C-06 execution relation resolution sync

on:
  push:
    branches: [image-i7c06-adversarial-certification-v0.1]
    paths:
      - '.github/workflows/i7c06-relation-resolution-sync.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: image-i7c06-adversarial-certification-v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: build/reference-vertical-slice/package-lock.json
      - name: Add explicit relation execution resolution contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('build/reference-vertical-slice/packages/execution/src/generic-resolved-plan.ts')
          s = p.read_text()
          old = """export interface SubprocessExecutionResolution {\n  semanticSubjectRef: string;\n  boundaryKind: 'INLINE_COORDINATION' | 'SEPARATE_EXECUTION_BOUNDARY';\n  authorityRef: string;\n  decidedBy: string;\n  rationale: string;\n}\n\nexport interface ExecutionCoordinationResolutionRecord {"""
          new = """export interface SubprocessExecutionResolution {\n  semanticSubjectRef: string;\n  boundaryKind: 'INLINE_COORDINATION' | 'SEPARATE_EXECUTION_BOUNDARY';\n  authorityRef: string;\n  decidedBy: string;\n  rationale: string;\n}\n\n/**\n * Explicit execution-design treatment for a frozen semantic relation whose\n * business kind does not itself determine an executable coordination kind.\n * This never rewrites the canonical ProcessEdge.\n */\nexport interface RelationExecutionResolution {\n  semanticRelationRef: string;\n  executionRelationKind: 'SEQUENCE' | 'WAIT_RESUME';\n  authorityRef: string;\n  decidedBy: string;\n  rationale: string;\n}\n\nexport interface ExecutionRelationResolutionRecord {\n  id: ExecutionId;\n  executionPlanRevisionId: ExecutionId;\n  semanticRelationRef: string;\n  sourceSemanticRelationKind: ProcessEdge['kind'];\n  resolvedExecutionRelationKind: 'SEQUENCE' | 'WAIT_RESUME';\n  authorityRef: string;\n  decidedBy: string;\n  rationale: string;\n  createdAt: string;\n}\n\nexport interface ExecutionCoordinationResolutionRecord {"""
          if old not in s: raise SystemExit('resolution interface anchor missing')
          s = s.replace(old, new, 1)

          old = """  coordinationResolutions: ExecutionCoordinationResolutionRecord[];\n  plannerVersion: string;"""
          new = """  coordinationResolutions: ExecutionCoordinationResolutionRecord[];\n  relationResolutions: ExecutionRelationResolutionRecord[];\n  plannerVersion: string;"""
          if old not in s: raise SystemExit('bundle anchor missing')
          s = s.replace(old, new, 1)

          old = """  subprocessResolutions: SubprocessExecutionResolution[],\n  createdAt: string,\n  parentExecutionPlanRevisionRef?: ExecutionId,\n): GenericResolvedExecutionBundle {"""
          new = """  subprocessResolutions: SubprocessExecutionResolution[],\n  createdAt: string,\n  parentExecutionPlanRevisionRef?: ExecutionId,\n  relationResolutions: RelationExecutionResolution[] = [],\n): GenericResolvedExecutionBundle {"""
          if old not in s: raise SystemExit('signature anchor missing')
          s = s.replace(old, new, 1)

          old = """  for (const resolution of subprocessResolutions) {\n    if (!resolution.authorityRef.trim() || !resolution.decidedBy.trim() || !resolution.rationale.trim()) throw new TypeError('subprocess execution resolution requires authority, decision owner and rationale');\n    const node = process.nodes.find((item) => item.id === resolution.semanticSubjectRef);\n    if (!node || node.kind !== 'SUBPROCESS') throw new TypeError(`subprocess resolution targets non-subprocess ${resolution.semanticSubjectRef}`);\n  }\n\n  const definitionId = exe(`generic-resolved-plan-definition:${process.processDefinitionId}`);"""
          new = """  for (const resolution of subprocessResolutions) {\n    if (!resolution.authorityRef.trim() || !resolution.decidedBy.trim() || !resolution.rationale.trim()) throw new TypeError('subprocess execution resolution requires authority, decision owner and rationale');\n    const node = process.nodes.find((item) => item.id === resolution.semanticSubjectRef);\n    if (!node || node.kind !== 'SUBPROCESS') throw new TypeError(`subprocess resolution targets non-subprocess ${resolution.semanticSubjectRef}`);\n  }\n  const relationResolutionBySemanticRef = new Map(relationResolutions.map((item) => [item.semanticRelationRef, item]));\n  if (relationResolutionBySemanticRef.size !== relationResolutions.length) throw new TypeError('duplicate execution relation resolution');\n  for (const resolution of relationResolutions) {\n    if (!resolution.authorityRef.trim() || !resolution.decidedBy.trim() || !resolution.rationale.trim()) throw new TypeError('execution relation resolution requires authority, decision owner and rationale');\n    const edge = process.edges.find((item) => item.id === resolution.semanticRelationRef);\n    if (!edge) throw new TypeError(`execution relation resolution targets missing semantic relation ${resolution.semanticRelationRef}`);\n    if (relationKind(edge) !== 'SOURCE_DEFINED') throw new TypeError(`execution relation resolution may only resolve a semantically preserved relation with no direct execution kind: ${resolution.semanticRelationRef}`);\n  }\n\n  const definitionId = exe(`generic-resolved-plan-definition:${process.processDefinitionId}`);"""
          if old not in s: raise SystemExit('resolution validation anchor missing')
          s = s.replace(old, new, 1)

          old = """    subprocessResolutions: subprocessResolutions.map((item) => ({\n      semanticSubjectRef: item.semanticSubjectRef,\n      boundaryKind: item.boundaryKind,\n      authorityRef: item.authorityRef,\n      decidedBy: item.decidedBy,\n      rationale: item.rationale,\n    })).sort((a, b) => a.semanticSubjectRef.localeCompare(b.semanticSubjectRef)),\n  });"""
          new = """    subprocessResolutions: subprocessResolutions.map((item) => ({\n      semanticSubjectRef: item.semanticSubjectRef,\n      boundaryKind: item.boundaryKind,\n      authorityRef: item.authorityRef,\n      decidedBy: item.decidedBy,\n      rationale: item.rationale,\n    })).sort((a, b) => a.semanticSubjectRef.localeCompare(b.semanticSubjectRef)),\n    relationResolutions: relationResolutions.map((item) => ({\n      semanticRelationRef: item.semanticRelationRef,\n      executionRelationKind: item.executionRelationKind,\n      authorityRef: item.authorityRef,\n      decidedBy: item.decidedBy,\n      rationale: item.rationale,\n    })).sort((a, b) => a.semanticRelationRef.localeCompare(b.semanticRelationRef)),\n  });"""
          if old not in s: raise SystemExit('resolution digest anchor missing')
          s = s.replace(old, new, 1)

          old = """  const coordinationResolutions: ExecutionCoordinationResolutionRecord[] = [];\n\n  for (const node of process.nodes) {"""
          new = """  const coordinationResolutions: ExecutionCoordinationResolutionRecord[] = [];\n  const relationResolutionRecords: ExecutionRelationResolutionRecord[] = [];\n\n  for (const node of process.nodes) {"""
          if old not in s: raise SystemExit('resolution record array anchor missing')
          s = s.replace(old, new, 1)

          old = """    const relationId = exe(`generic-resolved-relation:${revisionId}:${edge.id}`);\n    const complete = relationComplete(process, edge);\n    relations.push({\n      id: relationId,\n      executionPlanRevisionId: revisionId,\n      executionRegionRef: regionId,\n      sourceElementRef,\n      targetElementRef,\n      relationKind: relationKind(edge),\n      semanticRelationRefs: [edge.id],\n      ...(edge.conditionRuleRef ? { conditionRef: edge.conditionRuleRef } : {}),\n      relationState: complete ? 'COMPLETE' : 'INCOMPLETE',\n    });"""
          new = """    const relationId = exe(`generic-resolved-relation:${revisionId}:${edge.id}`);\n    const baseRelationKind = relationKind(edge);\n    const explicitResolution = relationResolutionBySemanticRef.get(edge.id);\n    const complete = relationComplete(process, edge) || Boolean(explicitResolution);\n    if (explicitResolution) {\n      relationResolutionRecords.push({\n        id: exe(`generic-relation-resolution:${revisionId}:${edge.id}`),\n        executionPlanRevisionId: revisionId,\n        semanticRelationRef: edge.id,\n        sourceSemanticRelationKind: edge.kind,\n        resolvedExecutionRelationKind: explicitResolution.executionRelationKind,\n        authorityRef: explicitResolution.authorityRef,\n        decidedBy: explicitResolution.decidedBy,\n        rationale: explicitResolution.rationale,\n        createdAt,\n      });\n    }\n    relations.push({\n      id: relationId,\n      executionPlanRevisionId: revisionId,\n      executionRegionRef: regionId,\n      sourceElementRef,\n      targetElementRef,\n      relationKind: explicitResolution?.executionRelationKind ?? baseRelationKind,\n      semanticRelationRefs: [edge.id],\n      ...(edge.conditionRuleRef ? { conditionRef: edge.conditionRuleRef } : {}),\n      relationState: complete ? 'COMPLETE' : 'INCOMPLETE',\n    });"""
          if old not in s: raise SystemExit('relation loop anchor missing')
          s = s.replace(old, new, 1)

          old = """    coordinationResolutions: coordinationResolutions.map((item) => ({ id: item.id, subject: item.semanticSubjectRef, kind: item.resolutionKind, authorityRef: item.authorityRef })),\n    elements:"""
          new = """    coordinationResolutions: coordinationResolutions.map((item) => ({ id: item.id, subject: item.semanticSubjectRef, kind: item.resolutionKind, authorityRef: item.authorityRef })),\n    relationResolutions: relationResolutionRecords.map((item) => ({ id: item.id, semanticRelationRef: item.semanticRelationRef, sourceKind: item.sourceSemanticRelationKind, resolvedKind: item.resolvedExecutionRelationKind, authorityRef: item.authorityRef })),\n    elements:"""
          if old not in s: raise SystemExit('execution digest anchor missing')
          s = s.replace(old, new, 1)

          old = """    assessment: planAssessment,\n    coordinationResolutions,\n    plannerVersion: PLANNER_VERSION,"""
          new = """    assessment: planAssessment,\n    coordinationResolutions,\n    relationResolutions: relationResolutionRecords,\n    plannerVersion: PLANNER_VERSION,"""
          if old not in s: raise SystemExit('return anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('build/reference-vertical-slice/packages/application/src/execution-design.ts')
          s = p.read_text()
          old = """    ...execution.coordinationResolutions.map(x=>['ExecutionCoordinationResolution',x] as [string,any]),\n  ];"""
          new = """    ...execution.coordinationResolutions.map(x=>['ExecutionCoordinationResolution',x] as [string,any]),\n    ...execution.relationResolutions.map(x=>['ExecutionRelationResolution',x] as [string,any]),\n  ];"""
          if old not in s: raise SystemExit('persistence anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('build/reference-vertical-slice/tests/image-i5c03-capability-resolution.test.ts')
          s = p.read_text()
          old = """    const subprocess = x.current.process.nodes.find((node) => node.kind === 'SUBPROCESS');\n    assert.ok(subprocess);\n    const plan = designGenericResolvedExecutionPlan("""
          new = """    const subprocess = x.current.process.nodes.find((node) => node.kind === 'SUBPROCESS');\n    assert.ok(subprocess);\n    const messageRelation = x.current.process.edges.find((edge) => edge.kind === 'MESSAGE');\n    assert.ok(messageRelation, 'Quarry-02 message interaction must remain canonical MESSAGE');\n    const plan = designGenericResolvedExecutionPlan("""
          if old not in s: raise SystemExit('primary test setup anchor missing')
          s = s.replace(old, new, 1)
          old = """      }],\n      AT,\n    );\n\n    assert.deepEqual(new Set(plan.revision.capabilityBindingRevisionRefs)"""
          new = """      }],\n      AT,\n      undefined,\n      [{\n        semanticRelationRef: messageRelation!.id,\n        executionRelationKind: 'SEQUENCE',\n        authorityRef: 'reference-execution-architect',\n        decidedBy: 'talos-reference-design',\n        rationale: 'Preserve the canonical MESSAGE business relationship while explicitly designing its in-workflow execution ordering as sequence coordination.',\n      }],\n    );\n\n    assert.deepEqual(new Set(plan.revision.capabilityBindingRevisionRefs)"""
          if old not in s: raise SystemExit('primary test call anchor missing')
          s = s.replace(old, new, 1)
          old = """    assert.equal(plan.coordinationResolutions[0].resolutionKind, 'INLINE_COORDINATION');\n    assert.equal(JSON.stringify(plan).includes('CHILD_WORKFLOW'), false);\n\n    assert.deepEqual(plan.requirements, [],"""
          new = """    assert.equal(plan.coordinationResolutions[0].resolutionKind, 'INLINE_COORDINATION');\n    assert.equal(plan.relationResolutions.length, 1);\n    assert.equal(plan.relationResolutions[0].semanticRelationRef, messageRelation!.id);\n    assert.equal(plan.relationResolutions[0].sourceSemanticRelationKind, 'MESSAGE');\n    assert.equal(plan.relationResolutions[0].resolvedExecutionRelationKind, 'SEQUENCE');\n    assert.equal(plan.relationResolutions[0].authorityRef, 'reference-execution-architect');\n    assert.equal(x.current.process.edges.find((edge) => edge.id === messageRelation!.id)?.kind, 'MESSAGE', 'execution design must never rewrite canonical MESSAGE truth');\n    assert.equal(JSON.stringify(plan).includes('CHILD_WORKFLOW'), false);\n\n    assert.deepEqual(plan.requirements, [],"""
          if old not in s: raise SystemExit('primary test assertions anchor missing')
          s = s.replace(old, new, 1)

          old = """    const subprocess = x.current.process.nodes.find((node) => node.kind === 'SUBPROCESS')!;\n    const plan = designGenericResolvedExecutionPlan("""
          new = """    const subprocess = x.current.process.nodes.find((node) => node.kind === 'SUBPROCESS')!;\n    const messageRelation = x.current.process.edges.find((edge) => edge.kind === 'MESSAGE')!;\n    const plan = designGenericResolvedExecutionPlan("""
          if old not in s: raise SystemExit('persistence test setup anchor missing')
          s = s.replace(old, new, 1)
          old = """      [{ semanticSubjectRef: subprocess.id, boundaryKind: 'INLINE_COORDINATION', authorityRef: 'reference-execution-architect', decidedBy: 'talos-reference-design', rationale: 'Explicit inline execution design.' }],\n      AT,\n    );\n    persistGenericCapabilityResolution"""
          new = """      [{ semanticSubjectRef: subprocess.id, boundaryKind: 'INLINE_COORDINATION', authorityRef: 'reference-execution-architect', decidedBy: 'talos-reference-design', rationale: 'Explicit inline execution design.' }],\n      AT,\n      undefined,\n      [{ semanticRelationRef: messageRelation.id, executionRelationKind: 'SEQUENCE', authorityRef: 'reference-execution-architect', decidedBy: 'talos-reference-design', rationale: 'Explicit execution ordering for the frozen MESSAGE relation.' }],\n    );\n    persistGenericCapabilityResolution"""
          if old not in s: raise SystemExit('persistence test call anchor missing')
          s = s.replace(old, new, 1)
          old = """    assert.equal(x.repo.listByKind('ExecutionCoordinationResolution').length, 1);\n    for (const forbidden"""
          new = """    assert.equal(x.repo.listByKind('ExecutionCoordinationResolution').length, 1);\n    assert.equal(x.repo.listByKind('ExecutionRelationResolution').length, 1);\n    for (const forbidden"""
          if old not in s: raise SystemExit('persistence assertion anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install exact lock
        working-directory: build/reference-vertical-slice
        run: npm ci
      - name: Verify relation resolution contract
        working-directory: build/reference-vertical-slice
        run: npm run image:i5c03:test
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/reference-vertical-slice/packages/execution/src/generic-resolved-plan.ts build/reference-vertical-slice/packages/application/src/execution-design.ts build/reference-vertical-slice/tests/image-i5c03-capability-resolution.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat(i7c06): require explicit execution resolution for preserved MESSAGE relation'
          git push origin HEAD:image-i7c06-adversarial-certification-v0.1
